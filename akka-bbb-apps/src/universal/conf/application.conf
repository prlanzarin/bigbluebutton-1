pekko {
  actor {
    debug {
      # enable DEBUG logging of all AutoReceiveMessages (Kill, PoisonPill et.c.)
      autoreceive = on
      # enable DEBUG logging of actor lifecycle changes
      lifecycle = on
    }
  }
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = "DEBUG"

  redis-publish-worker-dispatcher {
      mailbox-type = "org.apache.pekko.dispatch.SingleConsumerOnlyUnboundedMailbox"
      # Throughput defines the maximum number of messages to be
      # processed per actor before the thread jumps to the next actor.
      # Set to 1 for as fair as possible.
      throughput = 512
    }

  redis-subscriber-worker-dispatcher {
      mailbox-type = "org.apache.pekko.dispatch.SingleConsumerOnlyUnboundedMailbox"
      # Throughput defines the maximum number of messages to be
      # processed per actor before the thread jumps to the next actor.
      # Set to 1 for as fair as possible.
      throughput = 512
    }
}

client {
    clientSettingsFilePath = "/usr/share/bigbluebutton/html5-client/private/config/settings.yml"
    clientSettingsOverrideFilePath = "/etc/bigbluebutton/bbb-html5.yml"
    # Note: strict validation (refuse boot on a bad override file) is controlled by the single
    # `clientSettingsOverrideStrictValidation` property in /etc/bigbluebutton/bbb-web.properties,
    # shared with bbb-web - see SystemConfiguration.
}

redis {
    host="127.0.0.1"
    port=6379
    password=""
    # recording keys should expire in 14 days
    keyExpiry=1209600
}

postgres {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
        properties = {
            serverName = "127.0.0.1"
            portNumber = "5432"
            databaseName = "bbb_graphql"
            user = "bbb_core"
            password = "bbb_core"
        }
        numThreads = 1
        maxConnections = 1
        queueSize = 20000
}



expire {
  # time in seconds
  lastUserLeft = 60
  neverJoined = 300
}

services {
  bbbWebAPI = "https://192.168.23.33/bigbluebutton/api"
  sharedSecret = "changeme"
  checkSumAlgorithmForBreakouts = "sha256"
  graphqlMiddlewareAPI = "http://127.0.0.1:8378"
}

eventBus {
  meetingManagerChannel = "MeetingManagerChannel"
  outMessageChannel = "OutgoingMessageChannel"
  incomingJsonMsgChannel = "IncomingJsonMsgChannel"
  outBbbMsgMsgChannel = "OutBbbMsgChannel"
}

http {
  interface = "127.0.0.1"
  interface = ${?INTERFACE}
  port = 8901
  port = ${?PORT}
}

services {
  telizeHost = "www.telize.com"
  telizePort = 80
}

apps {
  checkPermissions = true
  ejectOnViolation = false
  endMeetingWhenNoMoreAuthedUsers = false
  endMeetingWhenNoMoreAuthedUsersAfterMinutes = 2
  reduceDuplicatedPick = false
}

# Server-wide camera sharing cap. Complements the per-meeting `meetingCameraCap`
# and per-user `userCameraCap` (bbb-web): those bound a single meeting, this one
# bounds the whole server, so a set of individually-compliant meetings can no
# longer overload it together.
globalCameraCap {
  enabled = false

  # Maximum simultaneous camera publishers across every meeting on this server.
  # 0 = no static ceiling; only `loadThresholds` below constrain the server.
  max = 0

  # Cameras a meeting that is already publishing keeps however constrained the
  # server is. It does not reserve capacity for a meeting that has not shared yet -
  # that could only be taken from someone else's live camera - so on a full server
  # a meeting with no cameras is allowed none until capacity frees up.
  minPerMeeting = 1

  # How often the cap is recomputed.
  evaluationInterval = 5 seconds

  # A relaxed cap must hold this long before it is applied, so a load spike that
  # comes and goes does not make cameras flap. Tightening is always immediate.
  releaseDelay = 30 seconds

  # EWMA weight of each new CPU/memory sample. 1.0 disables smoothing.
  loadSmoothingFactor = 0.3

  # Whether a /create call may lower this server's cap through the
  # `globalCameraCap` parameter. A meeting can only make the cap stricter, never
  # laxer, but a caller could still deny cameras server-wide - hence off by default.
  allowCreateOverride = false

  # Load-driven ceilings, applied on top of `max`. An entry applies when either
  # measurement is at or above its own threshold, and the lowest applicable `max`
  # wins. `cpu` and `memory` are host-wide fractions in [0,1]. Empty = axis off.
  loadThresholds = [
    { cpu = 0.75, memory = 0.80, max = 30 }
    { cpu = 0.85, memory = 0.90, max = 15 }
  ]
}

analytics {
  includeChat = true
}

voiceConf {
  recordPath = "/var/freeswitch/meetings"
  # Use ogg instead of wav to get smaller audio files.
  # Valid values "wav", "ogg", "flac", "opus"
  recordCodec = "opus"
  # FreeSWITCH sometimes loses audio frames in long recordings
  # this enable split audio recording in smaller files
  recordEnableFileSplitter = false
  # Duration of each recorded audio file if splitter is enabled
  recordFileSplitterIntervalInMinutes = 15
  # Interval seconds to check if FreeSWITCH is recording.
  checkRecordingInterval = 23
  # Internval seconds to sync voice users status.
  syncUserStatusInterval = 41
  # Voice users with no matching user record
  ejectRogueVoiceUsers = true

  # Path to the audio file being played when dial-in user is waiting for
  # approval. This can be relative to FreeSWITCH sounds folder
  dialInApprovalAudioPath = "ivr/ivr-please_hold_while_party_contacted.wav"

  # Time (seconds) to wait before requesting an audio channel hold after
  # muting a user. Used in the experimental, transparent listen only mode.
  toggleListenOnlyAfterMuteTimer = 4

  # Transparent listen only meeting-wide activation threshold.
  # Threshold is the number of muted duplex audio channels in a meeting.
  # 0 = disabled
  transparentListenOnlyThreshold = 0

  # muteOnStartThreshold: forces muteOnStart=true for a meeting when the number
  # of audio participants reaches the specified threshold.
  # Overrides any existing muteOnStart directive (bbb-web, API and the client).
  # 0 = disabled.
  muteOnStartThreshold = 0

  # Whether guest policy should be enforced on dial-in endpoints
  dialInEnforceGuestPolicy = true

  # Whether muteOnStart should be enforced on dial-in endpoints at join time.
  dialInEnforceMuteOnStart = false

  floorControl {
    # Enables akka-apps floor control based on its own VAD data (LiveKit only)
    enabled = true
    # Minimum duration of continuous talking to trigger floor switch
    minTalkingDuration = 2500
    # Bumper time to avoid frequent floor switches
    floorSwitchCooldown = 500
  }
}

recording {
  # set zero to disable chapter break
  chapterBreakLengthInMinutes = 0
}

transcript {
  words = 8 # per line
  lines = 2
}
